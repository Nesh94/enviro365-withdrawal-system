# --- Server ---
# Using 8081 instead of the default 8080 to avoid clashing with other
# things on this machine. Change it (or override with
# --server.port=<port> on the command line) if you need a different one.
server.port=8081

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:enviro365db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at /h2-console (username: sa, blank password, JDBC URL above)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# create-drop: schema is (re)built from the entities on every run, then
# data.sql seeds it. Fine for an in-memory demo DB; a real deployment
# would use a migration tool (Flyway/Liquibase) with 'validate' instead.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- App name ---
spring.application.name=enviro365-withdrawal-system
